name: Claude pull request review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.repository.private == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Create a repository-scoped Claude Reviewer token
        id: claude-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CLAUDE_REVIEWER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUDE_REVIEWER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write

      - name: Review the pull request diff with Claude
        run: node scripts/claude-review.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEWER_MODEL || 'claude-sonnet-5-5' }}
          GITHUB_TOKEN: ${{ steps.claude-app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
