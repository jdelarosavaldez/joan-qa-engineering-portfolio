name: Portfolio quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portfolio-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Set up Python for the static preview server
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Type-check the test framework
        run: npm run qa:check
      - name: Run portfolio checks
        run: npm run qa:test
      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-qa-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
