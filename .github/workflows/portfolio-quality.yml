name: Portfolio quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portfolio-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Set up Python for the static preview server
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Type-check the test framework
        run: npm run qa:check
      - name: Run portfolio checks
        run: npm run qa:test
      - name: Create a sanitized QA summary
        if: always()
        run: node scripts/create-qa-summary.mjs
        env:
          QA_ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          QA_COMMIT: ${{ github.sha }}
          QA_RUN_ID: ${{ github.run_id }}
          QA_RUN_NUMBER: ${{ github.run_number }}
          QA_WORKFLOW_RESULT: ${{ job.status }}
      - name: Upload test reports and sanitized summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-qa-evidence
          path: |
            playwright-report/
            test-results/
            qa-summary/
          if-no-files-found: warn
          retention-days: 14
